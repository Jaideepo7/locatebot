[project]
name = "locatebot"
version = "0.1.0"
description = "LiDAR + vision item-finding RC robot (Jetson Orin + Raspberry Pi)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
link = ["pyzmq>=25"]
dev = ["pytest>=7"]
remote = ["websockets>=12"]
pi = ["pigpio>=1.78"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["locatebot*"]
